name: course-registration

x-app: &app
  image: ${COMPOSE_PROJECT_NAME:-course-registration}-app:local
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:rw,nosuid,nodev,size=128m,mode=1777
  security_opt:
    - no-new-privileges:true
  environment: &app-env
    APP_ENV: docker
    COOKIE_SECURE: "false"
    ALLOWED_ORIGINS: http://127.0.0.1:${APP_PORT:-8080},http://localhost:${APP_PORT:-8080}
    DB_HOST: mysql
    DB_PORT: "3306"
    DB_NAME: course_registration
    POOL_SIZE: "8"
    POOL_OVERFLOW: "0"
  logging: &logging
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: course_registration
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MYSQL_ROOT_HOST: "%"
    secrets:
      - mysql_root_password
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, 127.0.0.1, --silent]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s
    logging: *logging

  init:
    <<: *app
    command: [bootstrap]
    restart: "no"
    environment:
      <<: *app-env
      BOOTSTRAP_OUTPUT_UID: ${LOCAL_UID:-0}
      BOOTSTRAP_OUTPUT_GID: ${LOCAL_GID:-0}
    depends_on:
      mysql:
        condition: service_healthy
    secrets:
      - mysql_root_password
      - app_db_password
      - catalog_db_password
      - billing_db_password
      - encryption_key
      - integration_key
    volumes:
      - type: bind
        source: ${DOCKER_STATE_DIR:?Run the one-click deployment script first}/accounts
        target: /bootstrap-output

  api:
    <<: *app
    command: [api]
    ports:
      - 127.0.0.1:${APP_PORT:-8080}:8000
    depends_on:
      init:
        condition: service_completed_successfully
      catalog:
        condition: service_healthy
    secrets:
      - app_db_password
      - encryption_key
      - integration_key
    healthcheck:
      test: [CMD, python, /app/scripts/docker_healthcheck.py, api]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 15s

  catalog:
    <<: *app
    command: [catalog]
    depends_on:
      init:
        condition: service_completed_successfully
    secrets:
      - catalog_db_password
      - encryption_key
      - integration_key
    healthcheck:
      test: [CMD, python, /app/scripts/docker_healthcheck.py, catalog]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 15s

  billing:
    <<: *app
    command: [billing]
    depends_on:
      init:
        condition: service_completed_successfully
    secrets:
      - billing_db_password
      - encryption_key
      - integration_key
    healthcheck:
      test: [CMD, python, /app/scripts/docker_healthcheck.py, billing]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 15s

  worker:
    <<: *app
    command: [worker]
    depends_on:
      init:
        condition: service_completed_successfully
      billing:
        condition: service_healthy
    secrets:
      - app_db_password
      - encryption_key
      - integration_key

volumes:
  mysql_data:

secrets:
  mysql_root_password:
    file: ${DOCKER_STATE_DIR:?Run the one-click deployment script first}/secrets/mysql_root_password
  app_db_password:
    file: ${DOCKER_STATE_DIR:?Run the one-click deployment script first}/secrets/app_db_password
  catalog_db_password:
    file: ${DOCKER_STATE_DIR:?Run the one-click deployment script first}/secrets/catalog_db_password
  billing_db_password:
    file: ${DOCKER_STATE_DIR:?Run the one-click deployment script first}/secrets/billing_db_password
  encryption_key:
    file: ${DOCKER_STATE_DIR:?Run the one-click deployment script first}/secrets/encryption_key
  integration_key:
    file: ${DOCKER_STATE_DIR:?Run the one-click deployment script first}/secrets/integration_key
